plugins { id 'com.android.application' }

android {
    namespace 'cz.anderle.fabric.notifications.client.app'
    compileSdk 35
    defaultConfig {
        applicationId 'cz.anderle.fabric.notifications.client.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "fabric-notifications-${variant.versionName}-${variant.name}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
